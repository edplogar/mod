<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="60%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <linearGradient id="innerShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803D" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#16A34A" stop-opacity="0.1" />
    </linearGradient>
    <filter id="emblemShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="3" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <g filter="url(#emblemShadow)">
    <!-- 5-Petal Flower Emblem corresponding to the uploaded logo -->
    <path d="M256 30C230 120 130 110 90 170C50 230 100 290 150 300C120 320 80 350 90 410C100 470 170 470 215 420C240 470 290 500 350 470C410 440 420 370 390 320C460 330 510 270 480 210C450 150 370 180 330 210C360 140 310 60 256 30Z" fill="url(#emblemGrad)" stroke="#14532D" stroke-width="6" stroke-linejoin="round" />
    
    {/* Inner cutout stamen gap accents */}
    <path d="M230 180 C240 220 210 260 170 280" fill="none" stroke="#14532D" stroke-width="8" stroke-linecap="round" />
    <path d="M280 200 C270 230 310 270 350 280" fill="none" stroke="#14532D" stroke-width="8" stroke-linecap="round" />
    <path d="M220 280 C250 270 270 310 260 360" fill="none" stroke="#14532D" stroke-width="8" stroke-linecap="round" />

    <!-- Center Pistil Core -->
