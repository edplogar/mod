<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="maskableBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#95A823" />
      <stop offset="100%" stop-color="#6F7E16" />
    </linearGradient>
    <filter id="shadowMask" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Full bleed background for Android maskable crops -->
  <rect width="512" height="512" fill="url(#maskableBg)" />
  
  <!-- Safe Zone Safe boundary (inner 75%) -->
  <g filter="url(#shadowMask)" transform="translate(256, 230) scale(0.9)">
    <!-- Petal 1 (Top) -->
    <path d="M0,0 C-26,-46 -26,-92 0,-115 C26,-92 26,-46 0,0 Z" fill="#FFFFFF" />
    <!-- Petal 2 (Top Right) -->
    <g transform="rotate(72)">
      <path d="M0,0 C-26,-46 -26,-92 0,-115 C26,-92 26,-46 0,0 Z" fill="#FFFFFF" />
    </g>
    <!-- Petal 3 (Bottom Right) -->
    <g transform="rotate(144)">
      <path d="M0,0 C-26,-46 -26,-92 0,-115 C26,-92 26,-46 0,0 Z" fill="#FFFFFF" />
    </g>
    <!-- Petal 4 (Bottom Left) -->
    <g transform="rotate(216)">
      <path d="M0,0 C-26,-46 -26,-92 0,-115 C26,-92 26,-46 0,0 Z" fill="#FFFFFF" />
    </g>
    <!-- Petal 5 (Top Left) -->
    <g transform="rotate(288)">
      <path d="M0,0 C-26,-46 -26,-92 0,-115 C26,-92 26,-46 0,0 Z" fill="#FFFFFF" />
    </g>
    
    <!-- Flower Center Core -->
    <circle cx="0" cy="0" r="32" fill="#EAEEBB" stroke="#95A823" stroke-width="4" />
    <circle cx="0" cy="0" r="14" fill="#6F7E16" />
  </g>
  
  <!-- Typography Banner well inside safe area -->
  <rect x="96" y="370" width="320" height="58" rx="18" fill="#231E1B" fill-opacity="0.95" />
  <text x="256" y="409" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="900" fill="#EAEEBB" text-anchor="middle" letter-spacing="3">MOD LOGAR</text>
</svg>
